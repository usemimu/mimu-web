    <!-- Structured data: FAQ — surfaces rich results for brand queries -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What is Mimuads?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Mimuads is Africa's AI-native digital out-of-home (DOOH) platform — and the infrastructure layer beneath it. SMEs self-serve campaigns on smart screens inside high-traffic venues like pharmacies, eateries and salons, while agencies, brands and buying platforms activate the same verified network at scale. AI handles targeting, APCON compliance and on-device viewership verification. Also known as Usemimu."
            }
          },
          {
            "@type": "Question",
            "name": "How does the viewership verification work?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Each screen runs an on-device AI model that counts real viewers anonymously — no camera data leaves the device. You buy against verified proof of play, not inflated estimates, which is the standard agency finance and clients require to sign off spend."
            }
          },
          {
            "@type": "Question",
            "name": "What kind of businesses advertise on Mimuads?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Everyone from SMEs and startups to established brands and the agencies that represent them. If your customer visits a pharmacy, eats out or stops by a salon, Mimuads puts your brand in front of them — self-serve for a single shop, or across the whole network for a national campaign."
            }
          },
          {
            "@type": "Question",
            "name": "Can agencies and brands buy at scale?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Agencies book across the whole verified network on behalf of clients today, with volume rates on larger campaigns and client-ready reporting — verified impressions, reach by LGA and peak-time performance. See the Agencies page for the full breakdown."
            }
          },
          {
            "@type": "Question",
            "name": "Can I buy programmatically or run Mimuads white-label?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "That's the roadmap. Beyond direct booking, Mimuads is building a supply-side API so agencies and DSPs can activate our inventory programmatically, plus white-label infrastructure to run a DOOH network — player software, AI targeting and computer-vision verification — under your own brand. Email hello@usemimu.com for early access."
            }
          },
          {
            "@type": "Question",
            "name": "Who can host a Mimuads screen?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Any venue with consistent foot traffic — pharmacies, eateries, salons, boutiques. We install the screen at no cost to you and handle all maintenance. Hosts earn passive income paid directly to their bank account every Friday."
            }
          },
          {
            "@type": "Question",
            "name": "Is Mimuads APCON registered?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Every creative on the Mimuads network is vetted for APCON compliance before it goes live. Advertisers don't manage that process separately — it's built into the platform."
            }
          }
        ]
      }
